[package]
name = "tim-term"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tim-term"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
textwrap = "0.16"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2.0"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
whoami = "1.5"
async-trait = "0.1"
tim-client = { path = "../tim-client" }
