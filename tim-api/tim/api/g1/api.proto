syntax = "proto3";

import "google/protobuf/timestamp.proto";

package tim.api.g1;

message Timite {
  uint64 id = 1;
  reserved 2;
  string username = 3;  // unique handle used to connect and to address: [a-z0-9_-]{1,32}
}

message ClientInfo {
  string platform = 1;
}

message Session {
  string key = 1;  // secret
  uint64 timite_id = 2;
  google.protobuf.Timestamp created_at = 3;
  ClientInfo client_info = 4;
}

// A timite named as `@username` in a message; resolved by the server when the message is sent.
message Mention {
  uint64 timite_id = 1;
  string username = 2;
}

message Message {
  uint64 id = 1;
  uint64 sender_id = 2;
  string content = 3;
  repeated Mention mentions = 4;
}

message Ability {
  string name = 1;
  string description = 2;
  repeated AbilityParameter params = 3;
}

message AbilityParameter {
  string name = 1;
  string description = 2;
}

message TimiteAbilities {
  Timite timite = 1;
  repeated Ability abilities = 2;
}

message CallAbility {
  uint64 timite_id = 1;
  uint64 sender_id = 2;
  string name = 3;
  string payload = 4;
  optional uint64 call_ability_id = 5;
  uint64 branch_id = 6;
}

message CallAbilityOutcome {
  uint64 call_ability_id = 1;
  optional string payload = 2;
  optional string error = 3;
}

// What a timite is doing, as state changes: every one is stored like any other event.

message TypingStarted {
  uint64 timite_id = 1;  // set by the server
}

message TypingStopped {
  uint64 timite_id = 1;  // set by the server
}

// A timite may run several tasks at once; task_id tells them apart.
message TaskStarted {
  uint64 timite_id = 1;  // set by the server
  uint64 task_id = 2;    // set by the server
  string task = 3;       // what is being done, e.g. "fs.search" or the request text
  uint64 source_event_id = 4;
}

message TaskStep {
  uint64 timite_id = 1;  // set by the server
  uint64 task_id = 2;
  string step = 3;       // where the task is now, e.g. "fs.read src/main.rs"
}

// One tool call of a task, recorded once the tool returned.
message TaskToolCall {
  uint64 timite_id = 1;  // set by the server
  uint64 task_id = 2;
  string tool = 3;       // e.g. fs.read, or Bash for Claude Code
  string arguments = 4;  // as the model sent them, usually JSON
  string output = 5;     // what the tool returned, cut by the sender
  optional string error = 6;
  string call_id = 7;
}

// One raw event from the coding engine, preserved for session replay.
message TaskModelEvent {
  uint64 timite_id = 1;  // set by the server
  uint64 task_id = 2;
  string engine = 3;     // e.g. claude or llm
  string payload = 4;    // raw engine event or an assembled model turn, as JSON
}

message TaskFinished {
  uint64 timite_id = 1;  // set by the server
  uint64 task_id = 2;
}

message DeclareAbilitiesReq {
  repeated Ability abilities = 1;
}

message DeclareAbilitiesRes {
}

message ListAbilitiesReq {
  optional uint64 timite_id = 1;
}

message ListAbilitiesRes {
  repeated TimiteAbilities abilities = 1;
}

message SpaceEvent {
  message Metadata {
    uint64 id = 1;
    google.protobuf.Timestamp emitted_at = 2;
    uint64 branch_id = 3;  // 0: main; otherwise the event this branch forks from
  }
  Metadata metadata = 1;
  oneof data {
    EventNewMessage event_new_message = 2;
    EventCallAbility event_call_ability = 3;
    EventCallAbilityOutcome event_call_ability_outcome = 4;
    EventTimiteConnected event_timite_connected = 5;
    EventTimiteDisconnected event_timite_disconnected = 6;
    EventTypingStarted event_typing_started = 7;
    EventTypingStopped event_typing_stopped = 8;
    EventTaskStarted event_task_started = 9;
    EventTaskStep event_task_step = 10;
    EventTaskFinished event_task_finished = 11;
    EventTaskToolCall event_task_tool_call = 12;
    EventTaskModelEvent event_task_model_event = 13;
  }
}

message EventNewMessage {
  Message message = 1;
}

message EventCallAbility {
  CallAbility call_ability = 1;
}

message EventCallAbilityOutcome {
  CallAbilityOutcome call_ability_outcome = 1;
  uint64 sender_id = 2;
}

message EventTimiteConnected {
  Timite timite = 1;
}

message EventTimiteDisconnected {
  Timite timite = 1;
}

message EventTypingStarted {
  TypingStarted typing_started = 1;
}

message EventTypingStopped {
  TypingStopped typing_stopped = 1;
}

message EventTaskStarted {
  TaskStarted task_started = 1;
}

message EventTaskStep {
  TaskStep task_step = 1;
}

message EventTaskFinished {
  TaskFinished task_finished = 1;
}

message EventTaskToolCall {
  TaskToolCall task_tool_call = 1;
}

message EventTaskModelEvent {
  TaskModelEvent task_model_event = 1;
}

// --[ RPC req/res ]--

message Error {
  uint64 code = 1;
  string description = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_USERNAME = 1;
}

// Opens a session as `username`, creating the timite on first use.
message TrustedConnectReq {
  reserved 1;
  ClientInfo client_info = 2;
  string username = 3;
}

message TrustedConnectRes {
  Session session = 1;
  ErrorCode error = 2;
}

message SendMessageReq {
  string content = 2;
  uint64 branch_id = 3;
}

message SendMessageRes {
  optional Error error = 1;
}

message SubscribeToSpaceReq {
  bool receive_own_messages = 1;
  optional uint64 branch_id = 3;  // unset: all branches
  optional uint64 after_id = 2;  // unset: live only; set: replay events with id > after_id first
}

message SendCallAbilityReq {
  CallAbility call_ability = 1;
}

message SendCallAbilityRes {
  uint64 call_ability_id = 1;
}

message SendCallAbilityOutcomeReq {
  CallAbilityOutcome outcome = 1;
}

message SendCallAbilityOutcomeRes {
}

message SendTypingStartedReq {
  uint64 branch_id = 1;
}

message SendTypingStartedRes {
}

message SendTypingStoppedReq {
  uint64 branch_id = 1;
}

message SendTypingStoppedRes {
}

message SendTaskStartedReq {
  string task = 1;
  uint64 branch_id = 2;
  uint64 source_event_id = 3;
}

message SendTaskStartedRes {
  uint64 task_id = 1;
}

message SendTaskStepReq {
  uint64 task_id = 1;
  string step = 2;
}

message SendTaskStepRes {
}

message SendTaskToolCallReq {
  TaskToolCall tool_call = 1;
}

message SendTaskToolCallRes {
}

message SendTaskModelEventReq {
  TaskModelEvent model_event = 1;
}

message SendTaskModelEventRes {
}

message SendTaskFinishedReq {
  uint64 task_id = 1;
}

message SendTaskFinishedRes {
}

message GetTimelineReq {
  uint64 offset = 1;
  uint32 size = 2;
  optional uint64 branch_id = 3;  // unset: all branches
}

message GetTimelineRes {
  uint64 offset = 1;
  uint32 size = 2;
  repeated SpaceEvent events = 3;
  repeated Timite timites = 4;
}

service TimGrpcApi {
  rpc TrustedConnect(TrustedConnectReq) returns (TrustedConnectRes);

  rpc SendMessage(SendMessageReq) returns (SendMessageRes);
  rpc SendCallAbility(SendCallAbilityReq) returns (SendCallAbilityRes);
  rpc SendCallAbilityOutcome(SendCallAbilityOutcomeReq) returns (SendCallAbilityOutcomeRes);
  rpc SendTypingStarted(SendTypingStartedReq) returns (SendTypingStartedRes);
  rpc SendTypingStopped(SendTypingStoppedReq) returns (SendTypingStoppedRes);
  rpc SendTaskStarted(SendTaskStartedReq) returns (SendTaskStartedRes);
  rpc SendTaskStep(SendTaskStepReq) returns (SendTaskStepRes);
  rpc SendTaskToolCall(SendTaskToolCallReq) returns (SendTaskToolCallRes);
  rpc SendTaskModelEvent(SendTaskModelEventReq) returns (SendTaskModelEventRes);
  rpc SendTaskFinished(SendTaskFinishedReq) returns (SendTaskFinishedRes);
  rpc DeclareAbilities(DeclareAbilitiesReq) returns (DeclareAbilitiesRes);

  rpc ListAbilities(ListAbilitiesReq) returns (ListAbilitiesRes);
  rpc GetTimeline(GetTimelineReq) returns (GetTimelineRes);

  rpc SubscribeToSpace(SubscribeToSpaceReq) returns (stream SpaceEvent);
}
