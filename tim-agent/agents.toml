[[agents]]
kind = "llm"
username = "jarvis"
provider = "deepseek:jarvis"
endpoint = "http://127.0.0.1:8787"
prompt = "jarvis.md"
model = "deepseek-v4-pro"
temperature = 1.0
live_interval_secs = 10
api_key = "${TIM_DEEPSEEK_API_KEY}"

