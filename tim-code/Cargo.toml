[package]
name = "tim-code"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tim-agent = { path = "../tim-agent" }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
