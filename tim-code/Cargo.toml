[package]
name = "tim-code"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
config = "0.14"
dotenvy = "0.15"
futures = "0.3"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3"
thiserror = "2.0.17"
tim-client = { path = "../tim-client" }
tim-llm = { path = "../tim-llm" }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
